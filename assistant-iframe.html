<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问数助理 · iframe 嵌入</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #0b1f3a; color: #e8f1fc; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 10px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    p { margin: 0; font-size: 13px; color: #8aa4c0; line-height: 1.6; max-width: 560px; }
    code { display: inline-block; margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: rgba(22, 80, 150, .35); color: #91caff; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>问数助理 iframe 嵌入入口</h1>
    <p>此页面供宿主系统通过菜单 URL / iframe src 接入。正式环境将按参数加载对应助理配置。</p>
    <code id="paramsPreview">正在读取参数…</code>
  </div>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      const code = q.get("assistantCode") || "—";
      const productCode = q.get("productCode") || "—";
      const appKey = q.get("appKey") || "";
      const el = document.getElementById("paramsPreview");
      if (el) {
        el.textContent = "assistantCode=" + code
          + "；productCode=" + productCode
          + (appKey ? ("；appKey=" + appKey.slice(0, 16) + "…") : "");
      }
    })();
  </script>
</body>
</html>
